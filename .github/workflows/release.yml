name: Release Build

# Publishing a GitHub release builds the game and attaches the archives to it.
# Running it by hand with an empty tag only builds and keeps the archives as
# workflow artifacts, so the pipeline can be checked without a release.

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing release tag to attach builds to (e.g. v0.2.0). Leave empty to build without a release.'
        required: false
        type: string

permissions:
  contents: write

concurrency:
  group: release-${{ github.event.release.tag_name || inputs.tag || github.run_id }}
  cancel-in-progress: false

env:
  UNITY_VERSION: 2022.3.34f1
  BUILD_NAME: ArcaneCasters
  TAG: ${{ github.event.release.tag_name || inputs.tag }}

jobs:
  build:
    name: Build ${{ matrix.label }}
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - targetPlatform: StandaloneWindows64
            label: Windows
          - targetPlatform: StandaloneOSX
            label: macOS
    steps:
      - name: Check the release exists
        if: env.TAG != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: gh release view "$TAG" >/dev/null || { echo "::error::Release $TAG does not exist. Publish it first."; exit 1; }

      - name: Free disk space
        uses: jlumbroso/free-disk-space@v1.3.1
        with:
          tool-cache: false
          android: true
          dotnet: true
          haskell: true
          large-packages: true
          docker-images: true
          swap-storage: true

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG || github.ref }}

      - name: Cache Library folder
        uses: actions/cache@v4
        with:
          path: Library
          key: Library-${{ matrix.targetPlatform }}-${{ hashFiles('Packages/packages-lock.json', 'ProjectSettings/ProjectVersion.txt') }}
          restore-keys: |
            Library-${{ matrix.targetPlatform }}-

      - name: Build ${{ matrix.label }}
        uses: game-ci/unity-builder@v4
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          unityVersion: ${{ env.UNITY_VERSION }}
          targetPlatform: ${{ matrix.targetPlatform }}
          buildName: ${{ env.BUILD_NAME }}
          buildsPath: build

      - name: Package build
        id: package
        env:
          TARGET: ${{ matrix.targetPlatform }}
          LABEL: ${{ matrix.label }}
        run: |
          set -euo pipefail
          sudo chown -R "$(id -u):$(id -g)" build
          # Burst writes debug symbols next to the player; they are not shipped.
          rm -rf "build/$TARGET"/*_BurstDebugInformation_DoNotShip
          if [ "$TARGET" = "StandaloneOSX" ]; then
            chmod -R +x "build/$TARGET/$BUILD_NAME.app/Contents/MacOS"
          fi
          VERSION="${TAG:-${GITHUB_SHA::8}}"
          ARCHIVE="$BUILD_NAME-$VERSION-$LABEL.zip"
          (cd "build/$TARGET" && zip -r -y -q "$GITHUB_WORKSPACE/$ARCHIVE" .)
          echo "archive=$ARCHIVE" >> "$GITHUB_OUTPUT"

      - name: Keep build as workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.package.outputs.archive }}
          path: ${{ steps.package.outputs.archive }}
          retention-days: 7

      - name: Upload build to release
        if: env.TAG != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          ARCHIVE: ${{ steps.package.outputs.archive }}
        run: gh release upload "$TAG" "$ARCHIVE" --clobber

  links:
    name: Link builds on release
    needs: build
    if: always() && (github.event.release.tag_name || inputs.tag)
    runs-on: ubuntu-latest
    steps:
      - name: Add download links to the release notes
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail

          asset_url() {
            name=$(gh release view "$TAG" --json assets -q ".assets[].name | select(endswith(\"$1\"))" | head -n 1)
            if [ -n "$name" ]; then
              printf '[%s](%s/%s/releases/download/%s/%s)' \
                "$name" "$GITHUB_SERVER_URL" "$GITHUB_REPOSITORY" "$TAG" "$name"
            fi
          }

          WIN=$(asset_url "-Windows.zip")
          MAC=$(asset_url "-macOS.zip")
          FAILED="빌드 실패, [로그 보기]($RUN_URL)"

          {
            echo '<!-- release-links:start -->'
            echo '## 다운로드'
            echo
            echo '| 플랫폼 | 파일 |'
            echo '| --- | --- |'
            echo "| Windows | ${WIN:-$FAILED} |"
            echo "| macOS | ${MAC:-$FAILED} |"
            echo
            echo '압축을 풀고 Windows는 `'"$BUILD_NAME"'.exe`, macOS는 `'"$BUILD_NAME"'.app`을 실행합니다.'
            echo 'macOS 빌드는 코드 서명이 없어서, 실행이 막히면 `xattr -dr com.apple.quarantine '"$BUILD_NAME"'.app`을 먼저 실행합니다.'
            echo '<!-- release-links:end -->'
          } > links.md

          gh release view "$TAG" --json body -q .body > body.md
          awk '
            $0 == "<!-- release-links:start -->" { skip = 1 }
            !skip { print }
            $0 == "<!-- release-links:end -->" { skip = 0 }
          ' body.md > body-clean.md
          { cat body-clean.md; echo; cat links.md; } > new-body.md
          gh release edit "$TAG" --notes-file new-body.md
